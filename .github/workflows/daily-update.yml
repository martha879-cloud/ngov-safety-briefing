name: Daily Safety Data Update

on:
  schedule:
    # 매일 한국시간 오전 8시 실행
    # GitHub Actions는 UTC 기준이므로 23:00 UTC = 한국시간 08:00
    - cron: "0 23 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install beautifulsoup4

      - name: Update MOFA travel alarm data
        env:
          MOFA_API_KEY: ${{ secrets.MOFA_API_KEY }}
        run: |
          python scripts/update_data.py

      - name: Update MOFA safety issues
        run: |
          python scripts/update_safety_issues.py

      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/

          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: update safety data"
            git push
      
