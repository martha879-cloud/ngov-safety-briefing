name: Daily Safety Data Update

on:
  schedule:
    - cron: "0 23 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install beautifulsoup4
          pip install deep-translator

      - name: Scrape 0404.go.kr country level list
        continue-on-error: true
        run: python scripts/scrape_mofa_country_list.py

      - name: Scrape 0404.go.kr travel alert adjustment reasons
        continue-on-error: true
        run: python scripts/scrape_travel_alert_reasons.py

      - name: Update MOFA travel alarm data
        env:
          MOFA_API_KEY: ${{ secrets.MOFA_API_KEY }}
        continue-on-error: true
        run: |
          python scripts/update_data.py

      - name: Update last_update.json
        run: |
          KST_TIME=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')
          echo "{\"updated\": \"$KST_TIME\"}" > docs/data/last_update.json

      - name: Update MOFA safety issues
        continue-on-error: true
        run: |
          python scripts/update_safety_issues.py
      
      - name: Update news safety issues
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        continue-on-error: true
        run: python scripts/update_news_issues.py

      - name: Update NewsData.io safety issues
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
        continue-on-error: true
        run: python scripts/update_newsdata_issues.py

      - name: Update USGS earthquake data
        continue-on-error: true
        run: python scripts/update_disaster_issues.py

      - name: Update US State Dept travel advisories
        continue-on-error: true
        run: python scripts/update_state_dept_issues.py

      - name: Update WHO disease outbreak news
        continue-on-error: true
        run: python scripts/update_who_issues.py

      - name: Update CDC travel health notices
        continue-on-error: true
        run: python scripts/update_cdc_issues.py

      # 외교부/국무부/CDC 변경사항을 비교하려면 이 셋의 데이터가 전부 갱신된 뒤에 실행되어야 해서
      # (국무부/CDC 스텝보다 앞에 있으면 어제 데이터랑 비교하게 되는 문제가 있었음) 맨 뒤로 옮김
      - name: 브리핑 / 변경사항 / 히스토리 생성
        continue-on-error: true
        run: python scripts/generate_reports.py

      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/ data/processed/

          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: update safety data"
            git push
          fi
